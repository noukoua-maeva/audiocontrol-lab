[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiocontrol-lab"
version = "0.1.0"
description = "Paired experiments for measuring text-to-audio attribute control"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Maëva Noukoua"}]
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
generation = ["torch>=2.2,<3", "diffusers==0.32.2", "transformers==4.48.3", "accelerate>=0.26,<2", "sentencepiece>=0.2,<1", "huggingface-hub>=0.27,<1"]

[project.scripts]
audiocontrol = "audiocontrol.cli:main"

[tool.setuptools.packages.find]
include = ["audiocontrol*"]
